server:
  port: 8083
  servlet:
    session:
      cookie:
        same-site: LAX
        secure: false
        http-only: true

spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/tasko_db
    username: tasko
    password: tasko

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, profile, email

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    org.springframework.security: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health, info

tasko:
  ai:
    enabled: true
    provider: openai
    openai-api-key: ${OPENAI_API_KEY:}
    model: gpt-4o-mini
    base-url: https://api.openai.com/v1
    timeout-seconds: 30

  mail:
    enabled: ${TASKO_MAIL_ENABLED:false}
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
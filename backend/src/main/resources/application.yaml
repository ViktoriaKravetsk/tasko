server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/tasko_db
    username: tasko
    password: tasko

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, profile, email

management:
  endpoints:
    web:
      exposure:
        include: health,info

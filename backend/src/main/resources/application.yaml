server:
  port: ${PORT:8083}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        same-site: ${SESSION_COOKIE_SAME_SITE:LAX}
        secure: ${SESSION_COOKIE_SECURE:false}
        http-only: true

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/tasko_db}
    username: ${SPRING_DATASOURCE_USERNAME:tasko}
    password: ${SPRING_DATASOURCE_PASSWORD:tasko}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, profile, email

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    org.springframework.security: ${SPRING_SECURITY_LOG_LEVEL:WARN}

management:
  endpoints:
    web:
      exposure:
        include: health, info

tasko:
  web:
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
    allowed-origins: ${TASKO_ALLOWED_ORIGINS:http://localhost:5173}

  ai:
    enabled: true
    provider: openai
    openai-api-key: ${OPENAI_API_KEY:}
    model: gpt-4o-mini
    base-url: https://api.openai.com/v1
    timeout-seconds: 30

  mail:
    enabled: ${TASKO_MAIL_ENABLED:false}
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
